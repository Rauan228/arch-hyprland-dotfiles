# Serpantinum — управление простоем (hypridle)
general {
    lock_cmd = $HOME/.config/serpantinum/bin/lock     # вызывается по `loginctl lock-session`
    before_sleep_cmd = loginctl lock-session    # блокировка ДО сна (в т.ч. при закрытии крышки)
    ignore_dbus_inhibit = false                 # видео/звонки не дают заблокировать экран
}

# 9 мин: приглушить подсветку
listener {
    timeout = 540
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 мин: заблокировать
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
