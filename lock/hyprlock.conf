# Serpantinum — экран блокировки (hyprlock 0.9.x)
# Палитра: графит + индиго → бирюза

$font      = JetBrainsMono Nerd Font
$text      = rgba(240, 242, 255, 1.0)
$muted     = rgba(240, 242, 255, 0.60)
$glass     = rgba(18, 20, 32, 0.55)
$accent1   = rgba(124, 108, 255, 1.0)
$accent2   = rgba(45, 212, 191, 1.0)
$fail      = rgba(255, 99, 120, 1.0)
$avatar    = $HOME/.config/serpantinum/avatars/current.png

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldColors, 1, 4, smooth
    animation = inputFieldFade, 1, 4, smooth
    animation = inputFieldWidth, 1, 5, smooth
    animation = inputFieldDots, 1, 3, smooth
}

# Размытый снимок рабочего стола вместо обоев
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.2
    noise = 0.012
}

# Время
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 132
    font_family = $font
    position = 0, 255
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# Дата (по-русски)
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/serpantinum/lock/date-ru.sh
    color = $muted
    font_size = 22
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

# Аватар
image {
    monitor =
    path = $avatar
    size = 112
    rounding = -1
    border_size = 3
    border_color = $accent1 $accent2 45deg
    position = 0, 10
    halign = center
    valign = center
    reload_time = -1
}

# Имя пользователя
label {
    monitor =
    text = $USER
    color = $text
    font_size = 20
    font_family = $font
    position = 0, -78
    halign = center
    valign = center
}

# Поле пароля
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    outer_color = $accent1 $accent2 45deg
    inner_color = $glass
    font_color = $text
    font_family = $font
    check_color = $accent2 $accent1 120deg
    fail_color = $fail
    capslock_color = rgba(250, 204, 21, 1.0)
    fade_on_empty = false
    fade_timeout = 1000
    rounding = 27
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    placeholder_text = <span foreground="##b4b9d6">Пароль</span>
    fail_text = <span foreground="##ff6378">$FAIL <b>($ATTEMPTS)</b></span>
    hide_input = false
    position = 0, -145
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}
